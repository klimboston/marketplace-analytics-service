[project]
name = "marketplace-analytics-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "klimboston", email = "kklimadv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[project.scripts]
marketplace-analytics-service = "marketplace_analytics_service:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.marketplace_analytics_service.main:app"
