services:
  web:
    build: .

    container_name: marketplace-analytics-fastapi

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  celery:
    build: .

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    command: celery -A src.marketplace_analytics_service.core.celery_app:celery_app worker --loglevel=info

    restart: unless-stopped
  db:
    image: postgres:17-alpine

    container_name: marketplace-analytics-postgres

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: marketplace-analytics-redis

    ports:
      - "127.0.0.1:6380:6379"

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    volumes:
      - redis_data:/data

    

volumes:
  postgres_data:
  redis_data:
